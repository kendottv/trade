<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>持股熱力圖 Fixture（離線）</title>
<link rel="stylesheet" href="site.css">
<style>
.fixture-nav { padding: 8px; background: #111; position: sticky; top: 0; z-index: 100; }
.fixture-nav button { margin: 4px; }
.heatmap { min-height: 360px; position: relative; }
.scene-info { padding: 6px 12px; color: #aaa; font-size: 13px; }
.hm-controls { display: inline-block; margin-left: 12px; }
</style>
</head>
<body>
<div class="fixture-nav" id="nav"></div>
<div class="scene-info" id="scene-info"></div>

<div class="hm-head">
  <h2>紙上持股</h2>
  <div class="hm-controls">
    <button id="paper-mode-heat" class="on">熱力圖</button>
    <button id="paper-mode-table">表格</button>
    <select id="paper-color"><option value="day" selected>今日漲跌</option><option value="pnl">買入後損益</option></select>
  </div>
</div>
<div id="paper-heatmap" class="heatmap"></div>
<div id="paper-unalloc" class="unalloc" hidden></div>
<div id="paper-detail" class="hm-detail" hidden></div>
<div class="cap" id="paper-time"></div>
<div class="tw" id="paper-table-wrap" hidden><table id="pos"></table></div>

<div class="hm-head" style="margin-top:24px;">
  <h2>模擬持股</h2>
  <div class="hm-controls">
    <button id="sim-mode-heat" class="on">熱力圖</button>
    <button id="sim-mode-table">表格</button>
    <select id="sim-color"><option value="day" selected>今日漲跌</option><option value="pnl">買入後損益</option></select>
  </div>
</div>
<div id="sim-heatmap" class="heatmap"></div>
<div id="sim-unalloc" class="unalloc" hidden></div>
<div id="sim-detail" class="hm-detail" hidden></div>
<div class="cap" id="sim-time"></div>
<div class="tw" id="sim-table-wrap" hidden><table id="simpos"></table></div>

<script>window.HEATMAP_FIXTURE = true;</script>
<script src="app.js"></script>

function setColorMode(prefix, mode) {
  const sel = document.getElementById(prefix + "-color");
  if (sel) {
    sel.value = mode;
    sel.dispatchEvent(new Event("change"));
  }
}
function setViewMode(prefix, view) {
  const heat = document.getElementById(prefix + "-mode-heat");
  const table = document.getElementById(prefix + "-mode-table");
  if (view === "table" && table) {
    table.click();
  } else if (heat) {
    heat.click();
  }
}
function loadScene(name) {
  const s = SCENES[name] || SCENES.paper_normal;
  const info = document.getElementById("scene-info");
  if (info) info.textContent = "場景：" + name + (s.error ? " · " + s.error : "");
  if (name.startsWith("sim")) {
    window._paperData = {positions:[], snapshotTs:"", quoteTs:"", stale:false};
    window._simData = s;
  } else {
    window._paperData = s;
    window._simData = {positions:[], snapshotTs:"", quoteTs:"", stale:false};
  }
  if (typeof window._paperShow === "function") window._paperShow();
  if (typeof window._simShow === "function") window._simShow();
}
document.getElementById("nav").innerHTML = Object.keys(SCENES).map(k =>
  `<button onclick="loadScene('${k}')">${k}</button>`).join("");
loadScene("paper_normal");
</script>
</body>
</html>
